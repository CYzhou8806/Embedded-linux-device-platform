# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-device-platform"
BBFILE_PATTERN_meta-device-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-device-platform = "6"

LAYERDEPENDS_meta-device-platform = "core"
LAYERSERIES_COMPAT_meta-device-platform = "scarthgap"

# Enables the custom-acq Device Tree overlay in config.txt (rpi-bootfiles
# is a shared recipe, not image-specific, so this has to live in global
# configuration metadata like this file - not in device-platform-image.bb,
# where it silently has no effect since rpi-bootfiles doesn't depend on
# that recipe's own variable scope). See device-tree/README.md for what
# the overlay does; see recipes-bsp/custom-acq-overlay for how the .dtbo
# gets built and deployed.
RPI_EXTRA_CONFIG += "dtoverlay=custom-acq"
