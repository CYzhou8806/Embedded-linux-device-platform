# Production-image sandbox for device-service (docs/security/hardening.md,
# finding F11). A drop-in, so the unit the development image and the manual
# install use stays unchanged.
#
# What the service really needs: /dev/acq0, write access to the driver's
# sysfs attributes (sample_rate, for backpressure), POSIX shared memory for
# devbus, sd_notify, and - only if config.json enables them - SCHED_FIFO
# and mlockall(). Everything else is taken away.
[Service]
# Still uid 0, because /dev/acq0 and the sysfs attributes are root-owned;
# but with no capabilities beyond the two the scheduling options need, root
# here can't override file permissions, load modules, or change ownership.
CapabilityBoundingSet=CAP_SYS_NICE CAP_IPC_LOCK
NoNewPrivileges=yes

# Whole filesystem read-only except /dev, /proc, /sys. ProtectKernelTunables
# is deliberately NOT set: it would make /sys read-only, and writing
# sample_rate there is how backpressure works.
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
DevicePolicy=closed
DeviceAllow=/dev/acq0 rw

# No network use at all: devbus is shared memory, sd_notify and journald
# are AF_UNIX.
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX

ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
