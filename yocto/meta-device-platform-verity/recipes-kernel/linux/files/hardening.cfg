# Kernel self-protection and attack-surface options for the A/B image
# (docs/security/hardening.md §7; checked with
# security/hardening/kconfig-hardening-check.py). Chosen for low cost and no
# change to what this device does. Deliberately NOT here, with the reason:
#   INIT_ON_FREE_DEFAULT_ON  measurable cost on every free
#   SECURITY_LOCKDOWN_LSM    blocks the ftrace/debugfs workflow this project
#                            debugs with (cases 04, 09)
#   KPROBES/FTRACE off       same
# (1.2.0: MODULE_SIG_FORCE on - the board showed custom_acq signed and
#  accepted; COMPAT and IO_URING off - no 32-bit ELF and no io_uring user
#  in the image, checked on the rootfs)
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_LIST_HARDENED=y
CONFIG_BUG_ON_DATA_CORRUPTION=y
CONFIG_SCHED_STACK_END_CHECK=y
CONFIG_DEBUG_WX=y
CONFIG_SECURITY=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_STRICT_DEVMEM=y
CONFIG_IO_STRICT_DEVMEM=y
# CONFIG_LEGACY_TIOCSTI is not set
# CONFIG_LDISC_AUTOLOAD is not set
# CONFIG_HIBERNATION is not set
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y
CONFIG_MODULE_SIG_FORCE=y
# CONFIG_COMPAT is not set
# CONFIG_IO_URING is not set

# Which LSMs are active, in order. Raspberry Pi's defconfig leaves this
# empty, and an empty list means "capability only": Yama above was built in
# but never initialised (/sys/kernel/security/lsm said "capability", and
# kernel.yama.ptrace_scope didn't exist) - found on the board. Built in is
# not the same as enabled.
CONFIG_LSM="yama"
