# Second hardening step (2026-10-01), from a full kernel-hardening-checker
# run (0.6.17.1) over the 6.12.93 config: 175 OK / 107 FAIL before this
# fragment. Each line below is one of those FAILs that is safe for this
# device. The FAILs that are kept on purpose, with the reason for each, are
# in docs/security/hardening.md §7 and
# results/security/hardening/kernel-hardening-checker-6.12.txt.
#
# Four checker items are absent from this fragment because 6.12 can't
# have them, not by choice: HARDENED_USERCOPY_DEFAULT_ON (no such option
# in 6.12), LSM_MMAP_MIN_ADDR (SELinux only), KPROBE_EVENTS (gone with
# KPROBES), ARM64_BTI_KERNEL ("depends on !CC_IS_GCC", GCC bug 106671).
# Found by diffing this fragment against the resulting .config.
#
# Booted on the board through the A/B update path (images 1.3.1/1.3.2,
# 2026-10-02): lockdown [integrity], LSMs lockdown,yama,landlock, no failed
# units, M8's tracepoints working. See hardening.md §7 for the A/B cost
# measurement.

# --- Lockdown: integrity, not confidentiality ------------------------------
# Integrity blocks what would let root modify the running kernel: unsigned
# modules (already forced), /dev/mem and /dev/kmem writes, kexec of an
# unsigned image, debugfs, raw I/O ports. Confidentiality would also block
# tracefs, perf and kprobes. That would switch off M8's field diagnostics
# (the custom_acq tracepoints), which is the deliberate trade made here.
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y
# Landlock: unprivileged sandboxing is available to any service that wants
# it. Nothing enforces anything until a program asks.
CONFIG_SECURITY_LANDLOCK=y
CONFIG_LSM="lockdown,yama,landlock"

# --- Tracing: keep the tracepoints, drop the rest -------------------------
# M8 uses static tracepoints and trace_marker only. Function tracing,
# kprobes and the stack tracer are what make ftrace an attack surface (they
# can patch or probe any kernel function), and nothing here uses them.
# FTRACE / EVENT_TRACING stay.
# CONFIG_FUNCTION_TRACER is not set
# CONFIG_STACK_TRACER is not set
# CONFIG_KPROBES is not set
# CONFIG_BLK_DEV_IO_TRACE is not set
# tracefs is its own filesystem (/sys/kernel/tracing); debugfs is not
# needed for it.
# CONFIG_DEBUG_FS is not set

# --- Heap and memory -------------------------------------------------------
CONFIG_RANDOM_KMALLOC_CACHES=y
# CONFIG_SLAB_MERGE_DEFAULT is not set
# Zeroing on free costs a memset per free. The latency matrix should be
# rerun with this kernel before it ships (docs/devbus-experiments.md).
CONFIG_INIT_ON_FREE_DEFAULT_ON=y
CONFIG_KFENCE=y
CONFIG_KFENCE_SAMPLE_INTERVAL=100
CONFIG_DEBUG_SG=y
CONFIG_DEBUG_NOTIFIERS=y
CONFIG_DEBUG_VIRTUAL=y
CONFIG_DEFAULT_MMAP_MIN_ADDR=65536
CONFIG_ARCH_MMAP_RND_BITS=30

# --- Stack -----------------------------------------------------------------
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
CONFIG_ZERO_CALL_USED_REGS=y
# Erase the kernel stack on return to userspace (6.12's name for what
# newer kernels call KSTACK_ERASE). Needs GCC plugins, which this build has.
CONFIG_GCC_PLUGIN_STACKLEAK=y
CONFIG_GCC_PLUGIN_LATENT_ENTROPY=y

# --- Attack surface: nothing on this image uses these ----------------------
# CONFIG_DEVMEM is not set
# CONFIG_DEVPORT is not set
# CONFIG_BINFMT_MISC is not set
# CONFIG_USER_NS is not set
# CONFIG_AIO is not set
# CONFIG_MAGIC_SYSRQ is not set
# CONFIG_LATENCYTOP is not set
# CONFIG_KGDB is not set
# CONFIG_SMB_SERVER is not set
# CONFIG_MPTCP is not set
# SCTP was =m only because the DLM selects it, and the DLM only because
# two cluster filesystems do. None of the three has a use here.
# CONFIG_GFS2_FS is not set
# CONFIG_OCFS2_FS is not set
# CONFIG_DLM is not set
# CONFIG_IP_SCTP is not set
# CONFIG_VIDEO_VIVID is not set
# CONFIG_XFS_SUPPORT_V4 is not set
# CONFIG_CACHESTAT_SYSCALL is not set
# CONFIG_INET_DIAG is not set
# RAUC writes the inactive slot, which is never mounted; nothing else
# writes a block device under a mounted filesystem.
# CONFIG_BLK_DEV_WRITE_MOUNTED is not set
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_PROC_MEM_NO_FORCE=y
# CONFIG_COREDUMP is not set
CONFIG_MODULE_SIG_SHA512=y
