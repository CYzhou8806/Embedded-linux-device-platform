# device-mapper targets built in, so the initramfs can set up the verity
# root (and later the LUKS data partition) without loading modules first.
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_DM_CRYPT=y

# Armv8 crypto extensions built in: dm-verity sets up the root in the
# initramfs, before any module could be loaded, and binds whatever sha256
# implementation exists then - with these as modules that was sha256-generic
# (case 10). AES-CE is used by the LUKS data partition (aes-xts).
CONFIG_CRYPTO_SHA256_ARM64=y
CONFIG_CRYPTO_SHA2_ARM64_CE=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_AES_ARM64=y
CONFIG_CRYPTO_AES_ARM64_CE=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y

# LUKS2 with authenticated encryption on the data partition
# (cryptsetup --integrity hmac-sha256): dm-integrity stores a per-sector
# tag, authenc(hmac(sha256),xts(aes)) computes it.
CONFIG_DM_INTEGRITY=y
CONFIG_CRYPTO_AUTHENC=y
CONFIG_CRYPTO_HMAC=y
