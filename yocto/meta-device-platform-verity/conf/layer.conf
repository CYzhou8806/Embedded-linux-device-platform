# dm-verity variant of device-platform-image-prod. Separate from
# meta-device-platform so that adding it changes nothing in builds that
# don't use it - see docs/security/integrity-and-encryption.md.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "meta-device-platform-verity"
BBFILE_PATTERN_meta-device-platform-verity = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-device-platform-verity = "7"
LAYERDEPENDS_meta-device-platform-verity = "core meta-device-platform security"
LAYERSERIES_COMPAT_meta-device-platform-verity = "scarthgap"

# device-platform-image-ab: each boot partition picks its own kernel command
# line (root partition + RAUC slot name). [boot_partition=N] is a
# config.txt filter of the Pi 5 bootloader; on images booting from
# partition 1 neither section applies.
RPI_EXTRA_CONFIG:append = "\n[boot_partition=2]\ncmdline=cmdline-a.txt\n[boot_partition=3]\ncmdline=cmdline-b.txt\n[all]\n"

# Kernel 6.12 for the A/B image (security plan: the scarthgap default 6.6.63
# is 94 stable releases behind; docs/security/hardening.md §4). This layer is
# only in the dm-verity build directory, so the main build and the RT
# experiments keep their kernel.
PREFERRED_VERSION_linux-raspberrypi = "6.12%"

# pstore/ramoops: keep the previous boot's kernel log in RAM across a
# reboot (restart_on_corruption, a panic, a watchdog). The first
# restart-on-corruption test left no trace of *why* the slot fell back
# (docs/security/integrity-and-encryption.md §7). The kernel tree's
# ramoops overlays don't fit BCM2712 - recipes-bsp/ramoops-pi5-overlay
# (added to the boot files in device-platform-image-ab.bb: KERNEL_DEVICETREE
# set here, globally, made the kernel try to build it and fail).
RPI_EXTRA_CONFIG:append = "\n# previous boot's console log in /sys/fs/pstore after a reboot\ndtoverlay=ramoops-pi5\n"
