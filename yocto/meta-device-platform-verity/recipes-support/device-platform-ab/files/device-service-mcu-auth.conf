# device-service starts only if the MCU authenticates (device-platform-mcu-auth).
# "+": runs with full privileges, outside the service's sandbox - it reads
# the pairing key (root 0600) and writes the root-only auth_challenge.
[Unit]
After=device-platform-data.service
Requires=device-platform-data.service

[Service]
ExecStartPre=+/usr/sbin/device-platform-mcu-auth
