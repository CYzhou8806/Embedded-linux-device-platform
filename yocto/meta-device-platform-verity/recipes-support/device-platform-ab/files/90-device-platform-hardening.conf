# Runtime kernel hardening for device-platform-image-ab
# (docs/security/hardening.md §7). A leading "-" makes systemd-sysctl skip a
# key this kernel doesn't have instead of failing.

# Kernel pointers in /proc/kallsyms, /proc/modules etc.: hidden from everyone
# (2), so a local attacker can't read addresses to defeat KASLR.
kernel.kptr_restrict = 2
# dmesg only for CAP_SYSLOG - the kernel log leaks addresses and state.
kernel.dmesg_restrict = 1
# No unprivileged eBPF (a recurring source of kernel exploits); JIT hardened
# (constant blinding) for everyone.
-kernel.unprivileged_bpf_disabled = 1
-net.core.bpf_jit_harden = 2
# perf: no unprivileged access to kernel profiling.
kernel.perf_event_paranoid = 2
# Nothing on this device replaces the running kernel.
-kernel.kexec_load_disabled = 1
# No magic SysRq from a keyboard or /proc/sysrq-trigger.
kernel.sysrq = 0
# No core dumps of setuid programs (they may hold secrets).
fs.suid_dumpable = 0
# Line disciplines are not auto-loaded when an unprivileged process asks
# for one (CVE-2017-2636 class).
dev.tty.ldisc_autoload = 0
# ptrace only of own children, if Yama is built in.
-kernel.yama.ptrace_scope = 1
# userfaultfd only for privileged users (used to widen race windows in
# kernel exploits).
-vm.unprivileged_userfaultfd = 0

# Network: this is an end device, not a router.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
