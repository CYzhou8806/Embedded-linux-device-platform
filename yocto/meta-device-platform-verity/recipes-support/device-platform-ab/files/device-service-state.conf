# Fault evidence and calibration.json on the encrypted data partition, so
# they survive the reboot that usually follows a fault. Without this
# StateDirectory= (/var/lib/device-service) is on /var/volatile, a tmpfs,
# and the evidence is gone exactly when someone wants to read it.
#
# "+": the directory is created as root, outside the sandbox, and handed to
# acq. "-" on BindPaths: if /data is not mounted (degraded boot) the bind
# is skipped and evidence stays on the tmpfs rather than the service
# failing to start - acquisition matters more than its post-mortem.
[Unit]
After=device-platform-data.service

[Service]
# mkdir/chown/chmod, not `install -d`: this image's BusyBox has no install
# applet. The first version used it, and device-service never started on
# the board (status 127, 2026-10-02) - the same class of failure as case 11.
ExecStartPre=+/bin/sh -c 'if mountpoint -q /data && [ ! -e /run/device-platform-data.degraded ]; then mkdir -p /data/device-service && chown acq:acq /data/device-service && chmod 0750 /data/device-service; fi'
BindPaths=-/data/device-service:/var/lib/device-service
