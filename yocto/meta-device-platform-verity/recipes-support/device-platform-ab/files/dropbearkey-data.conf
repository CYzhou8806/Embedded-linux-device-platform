# Host key: on /data when it works, in /run otherwise (dropbear-hostkey).
# Ordered after the data partition, but only Wants= it: SSH must come up
# even when /data doesn't.
[Unit]
Wants=device-platform-data.service
After=device-platform-data.service
ConditionPathExists=

[Service]
ExecStart=
ExecStart=/usr/sbin/dropbear-hostkey
