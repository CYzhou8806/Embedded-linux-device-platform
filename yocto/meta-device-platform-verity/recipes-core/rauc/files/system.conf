# RAUC on device-platform-image-ab (docs/security/update-and-provisioning.md).
[system]
compatible=device-platform-rpi5
bootloader=custom
# Anti-rollback: bundles older than the release this image was built as are
# refused. Filled in from DEVICE_PLATFORM_RELEASE at build time.
min-bundle-version=@MIN_BUNDLE_VERSION@
# Slot state survives the read-only root on the encrypted data partition.
data-directory=/data/rauc
bundle-formats=-plain

[handlers]
bootloader-custom-backend=/usr/lib/device-platform/rauc-tryboot-backend

[keyring]
# The Update CA certificate and its CRL in one file (1.2.0 on; before, the
# CA alone). The CRL revokes release-1 (update-and-provisioning.md §6).
path=/etc/rauc/@KEYRING@
# The release signing certificate carries extendedKeyUsage=codeSigning;
# RAUC's default purpose check would reject it.
check-purpose=codesign
# Revocation is only enforced with this set - and with it set, a keyring
# without a valid (unexpired) CRL rejects EVERY bundle. The CRL has to be
# renewed before its nextUpdate, by shipping it in a release.
check-crl=true

# The firmware boots partition 2 or 3 (autoboot.txt); each boot partition's
# cmdline points at its own verity root and names its slot (rauc.slot=).
[slot.rootfs.0]
device=/dev/mmcblk0p5
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=raw
bootname=B

[slot.boot.0]
device=/dev/mmcblk0p2
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/mmcblk0p3
type=vfat
parent=rootfs.1
