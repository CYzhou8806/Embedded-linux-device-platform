  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1a211e; --ink:#e3ebe6; --muted:#9aa8a0; --line:#3d4a44;
    --chip-bg:#26302c; --chip-ink:#c3d0c9; --focus:#7cc4ad;
    --b0:#6fc2a8; --b1:#d9a55a; --b2:#d68aa6; --b3:#79b3de; --b4:#b3c46a; --b5:#b69ae0; --b6:#e39472; --b7:#7fc0c0; --b8:#a3b0a8;
    --tint:.16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --ink:#e3ebe6; --muted:#9aa8a0; --line:#3d4a44;
  --chip-bg:#26302c; --chip-ink:#c3d0c9; --focus:#7cc4ad;
  --b0:#6fc2a8; --b1:#d9a55a; --b2:#d68aa6; --b3:#79b3de; --b4:#b3c46a; --b5:#b69ae0; --b6:#e39472; --b7:#7fc0c0; --b8:#a3b0a8;
  --tint:.16;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--chip-bg);padding:4px;border-radius:8px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab:focus-visible,.node:focus-visible,.tool:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tool{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:6px;cursor:pointer}
.legend{color:var(--muted);font-size:12px;margin-left:auto}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.key h2{font-size:13px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px}
.ladder span.step{background:var(--chip-bg);color:var(--chip-ink);padding:1px 8px;border-radius:4px}
.ladder .arr{color:var(--muted)}
.key p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;padding:18px 12px}
/* tree */
.mm{display:flex;align-items:center;min-width:max-content}
.mm ul{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;justify-content:center;position:relative}
.mm ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:1.5px solid var(--line)}
.mm li{display:flex;align-items:center;position:relative;padding:3px 0 3px 16px}
.mm li::before{content:"";position:absolute;left:0;top:50%;width:16px;border-top:1.5px solid var(--line)}
.mm li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.mm li:first-child::after{top:50%}
.mm li:last-child::after{bottom:50%}
.mm li:only-child::after{display:none}
.node{font:inherit;color:inherit;text-align:left;border:1px solid transparent;background:transparent;padding:3px 8px;border-radius:6px;max-width:300px;display:block}
.node .t{display:block}
.node .d{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.node .q{display:inline-flex;gap:3px;flex-wrap:wrap;margin-left:4px;vertical-align:1px}
.node .q b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:10.5px;background:var(--chip-bg);color:var(--chip-ink);padding:0 5px;border-radius:3px}
.root{font-size:16px;font-weight:700;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:180px}
.root .d{color:var(--bg);opacity:.75}
.branch{font-weight:700;border-color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--surface));cursor:pointer;min-width:150px}
.branch .no{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--c);font-weight:500;display:block;letter-spacing:.04em}
.branch .d{font-weight:400}
.branch::after{content:attr(data-toggle);float:right;margin-left:8px;color:var(--c);font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500}
.mid{font-weight:500;border-left:3px solid var(--c);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.leaf{font-size:13px}
.bl{font-size:10.5px;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--c);display:block;margin-top:2px}
footer{color:var(--muted);font-size:12px}
@media (max-width:600px){ h1{font-size:19px} .legend{margin-left:0} }
@media (prefers-reduced-motion:no-preference){ .node{transition:background .15s} }
</style>

      {t:"亲和性", kids:[{t:"IRQ 亲和性管中断代码",q:[45]},{t:"CPU 亲和性管用户线程",q:[45]}]},
      {t:"测延迟", kids:[{t:"逻辑分析仪：MCU 翻引脚 → 中断响应",q:[46]}]},
      {t:"实时", kids:[{t:"SCHED_FIFO · mlockall · PREEMPT_RT"}]}
    ]},
    {no:"V8", t:"安全", d:"见另一张图", kids:[
      {t:"8 课 · Q47–Q81", d:"切换到“安全专项”标签"}
    ]}
  ]
}
};

const COLORS = ["--b0","--b1","--b2","--b3","--b4","--b5","--b6","--b7","--b8"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function qChips(q){ return q && q.length ? `<span class="q">${q.map(n=>`<b>Q${n}</b>`).join("")}</span>` : ""; }
function nodeHTML(n, cls){
  return `<span class="t">${esc(n.t)}${qChips(n.q)}</span>${n.d?`<span class="d">${esc(n.d)}</span>`:""}`;
}
function renderKids(kids, depth){
  if(!kids || !kids.length) return "";
  return `<ul>${kids.map(k=>{
    const cls = depth===0 ? "node mid" : "node leaf";
    return `<li><div class="${cls}">${nodeHTML(k)}</div>${renderKids(k.kids, depth+1)}</li>`;
  }).join("")}</ul>`;
}
function render(key){
  const m = MAPS[key];
  document.getElementById("title").textContent = m.title;
  document.getElementById("subtitle").textContent = m.subtitle;
  document.getElementById("foot").textContent = m.foot;
  document.getElementById("keys").innerHTML = m.keys.map(k=>`
    <div class="key"><h2>${esc(k.h)}</h2>
      <div class="ladder">${k.steps.map((s,i)=>`${i?'<span class="arr">→</span>':''}<span class="step">${esc(s)}</span>`).join("")}</div>
      <p>${esc(k.p)}</p></div>`).join("");
  const branches = m.branches.map((b,i)=>{
    const c = `var(${COLORS[i%COLORS.length]})`;
    return `<li style="--c:${c}">
      <button class="node branch" aria-expanded="true" data-toggle="−">
        <span class="no">${esc(b.no)}</span>
        <span class="t">${esc(b.t)}</span>${b.d?`<span class="d">${esc(b.d)}</span>`:""}${b.bl?`<span class="bl">${esc(b.bl)}</span>`:""}
      </button>
      ${renderKids(b.kids,0)}</li>`;
  }).join("");
  document.getElementById("map").innerHTML =
    `<div class="mm"><div class="node root"><span class="t">${esc(m.root.t)}</span><span class="d">${esc(m.root.d)}</span></div><ul>${branches}</ul></div>`;
  document.querySelectorAll("#map .branch").forEach(btn=>{
    btn.addEventListener("click",()=>setOpen(btn, btn.getAttribute("aria-expanded")!=="true"));
  });
  // mid-level colors inherit --c via the li style
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.map===key ? "true":"false"));
}
function setOpen(btn, open){
  const ul = btn.parentElement.querySelector(":scope > ul");
  if(ul) ul.hidden = !open;
  btn.setAttribute("aria-expanded", open ? "true":"false");
  btn.dataset.toggle = open ? "−" : "+";
}
function setAll(open){ document.querySelectorAll("#map .branch").forEach(b=>setOpen(b, open)); }

function pick(key){
  render(key);
  try{ localStorage.setItem("mm-tab", key); }catch(e){}
  if(location.hash !== "#"+key){ try{ history.replaceState(null,"","#"+key); }catch(e){} }
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>pick(t.dataset.map)));
document.getElementById("expand-all").addEventListener("click",()=>setAll(true));
document.getElementById("collapse-all").addEventListener("click",()=>setAll(false));

let start = "security";
const h = location.hash.replace("#","");
if(MAPS[h]) start = h; else { try{ const s = localStorage.getItem("mm-tab"); if(MAPS[s]) start = s; }catch(e){} }
render(start);
</script>
</body>
